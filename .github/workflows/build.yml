# Κάθε push και κάθε Pull Request: compile, Checkstyle, tests, SpotBugs, coverage.
# Αν κάτι αποτύχει, το PR δείχνει κόκκινο Χ και δεν γίνεται merge.
name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build και έλεγχοι
        run: mvn -B verify
      - name: Αναφορά coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
